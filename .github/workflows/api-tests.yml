
name: API Automation Tests

on:
  push:
  pull_request:

jobs:
  api-tests:
    name: Run Java API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run API tests
        run: mvn --batch-mode test
